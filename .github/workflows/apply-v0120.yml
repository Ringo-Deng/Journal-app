name: Apply v0.1.20 patch

on:
  push:
    branches:
      - chatgpt/v0.1.20
    paths:
      - .chatgpt-v0120/READY

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.1.20
          fetch-depth: 0

      - name: Apply source patch
        shell: bash
        run: |
          cat .chatgpt-v0120/part*.patch > /tmp/v0120.patch
          git apply --check /tmp/v0120.patch
          git apply /tmp/v0120.patch

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Run source tests
        shell: bash
        run: |
          TEST_FILES=$(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'launcher.test.mjs' -print)
          node --experimental-strip-types --test $TEST_FILES
          node -e "const p=require('./package.json'); if(p.version!=='0.1.20') process.exit(1)"
          grep -q "APP_VERSION = '0.1.20'" local/launch.mjs
          grep -q "EXPECTED_RUNTIME = 'page-elements-v0.1.20'" local/launch.mjs

      - name: Commit v0.1.20 source
        shell: bash
        run: |
          rm -rf .chatgpt-v0120
          rm -f .github/workflows/apply-v0120.yml
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add -A
          git commit -m "feat: update Shiguang Journal to v0.1.20"
          git push origin HEAD:chatgpt/v0.1.20
