name: Build v0.1.17 offline deps

on:
  push:
    branches:
      - build/offline-v0.1.17
  workflow_dispatch:

jobs:
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Create exact v0.1.12 package manifest
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "shiguang-journal-build-deps",
            "version": "0.1.17",
            "private": true,
            "type": "module",
            "dependencies": {
              "react": "19.2.6",
              "react-dom": "19.2.6",
              "react-server-dom-webpack": "19.2.6",
              "vinext": "1.0.0-beta.5",
              "@base-ui/react": "1.7.0",
              "@shadcn/react": "0.3.0",
              "class-variance-authority": "0.7.1",
              "clsx": "2.1.1",
              "cmdk": "1.1.1",
              "date-fns": "4.1.0",
              "embla-carousel-react": "8.5.2",
              "input-otp": "1.4.2",
              "lucide-react": "1.31.0",
              "react-day-picker": "9.8.1",
              "react-resizable-panels": "4.5.8",
              "recharts": "3.8.0",
              "shadcn": "4.18.0",
              "tailwind-merge": "3.6.0",
              "tw-animate-css": "1.4.0"
            },
            "devDependencies": {
              "@cloudflare/vite-plugin": "1.37.1",
              "@cloudflare/workers-types": "4.20260515.1",
              "@openai/sites-vite-plugin": "0.2.0",
              "@tailwindcss/postcss": "4.2.1",
              "@types/node": "22.19.19",
              "@types/react": "19.2.14",
              "@types/react-dom": "19.2.3",
              "@vitejs/plugin-react": "6.0.2",
              "@vitejs/plugin-rsc": "0.5.26",
              "oxfmt": "0.61.0",
              "oxlint": "1.76.0",
              "oxlint-tsgolint": "7.0.2001",
              "tailwindcss": "4.2.1",
              "typescript": "5.9.3",
              "vite": "8.0.13",
              "wrangler": "4.92.0"
            }
          }
          EOF

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Pack dependencies
        run: tar -czf shiguang-v017-linux-node-modules.tgz node_modules package-lock.json

      - name: Upload dependencies
        uses: actions/upload-artifact@v4
        with:
          name: shiguang-v017-linux-node-modules
          path: shiguang-v017-linux-node-modules.tgz
          compression-level: 0
          retention-days: 1
