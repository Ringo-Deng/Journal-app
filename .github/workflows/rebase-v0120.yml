name: Sync v0.1.20 with latest main

on:
  push:
    branches:
      - chatgpt/v0.1.20
    paths:
      - .chatgpt-merge-v0120/READY

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.1.20
          fetch-depth: 0

      - name: Merge latest main while preserving new dependencies
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          MERGE_CODE=$?
          set -e
          if [ "$MERGE_CODE" -ne 0 ]; then
            UNMERGED=$(git diff --name-only --diff-filter=U)
            echo "Conflicts: $UNMERGED"
            for f in $UNMERGED; do
              if [ "$f" != "package.json" ] && [ "$f" != "package-lock.json" ]; then
                echo "Unexpected conflict: $f"
                exit 1
              fi
            done
            git checkout --theirs package.json package-lock.json
            git add package.json package-lock.json
          fi
          npm version 0.1.20 --no-git-tag-version --allow-same-version
          git add package.json package-lock.json
          git commit -m "chore: sync v0.1.20 with latest main"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Run source tests
        shell: bash
        run: |
          TEST_FILES=$(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'launcher.test.mjs' -print)
          node --experimental-strip-types --test $TEST_FILES
          node -e "const p=require('./package.json'); if(p.version!=='0.1.20') process.exit(1); if(!p.dependencies['three'] || !p.dependencies['@react-three/fiber']) process.exit(2)"
          grep -q "APP_VERSION = '0.1.20'" local/launch.mjs

      - name: Clean staging files and push
        shell: bash
        run: |
          rm -rf .chatgpt-merge-v0120
          rm -f .github/workflows/rebase-v0120.yml
          git add -A
          git commit -m "chore: finalize v0.1.20 sync"
          git push origin HEAD:chatgpt/v0.1.20
