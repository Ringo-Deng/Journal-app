name: Stage snap guides v110
on:
  push:
    branches: [automation/snap-guides-v110]
permissions:
  contents: write
jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/snap-guides-v110
      - name: Patch latest editor
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='app/page.tsx';
          let s=fs.readFileSync(file,'utf8');
          function once(from,to,label){
            const i=s.indexOf(from);
            if(i<0) throw new Error('Missing anchor: '+label);
            if(s.indexOf(from,i+1)>=0) throw new Error('Ambiguous anchor: '+label);
            s=s.slice(0,i)+to+s.slice(i+from.length);
          }
          once(
            "import {isPieceHidden,pieceGroupName,pieceLayerName,reorderLayerBlock,withLayerMeta} from '@/lib/layer-meta';\n",
            "import {isPieceHidden,pieceGroupName,pieceLayerName,reorderLayerBlock,withLayerMeta} from '@/lib/layer-meta';\nimport {buildSnapTargets,snapMoveBox,type SnapGuides} from '@/lib/snap-guides';\n",
            'snap import',
          );
          once(
            "  const [selectionSize,setSelectionSize]=useState({w:0,h:0});\n",
            "  const [selectionSize,setSelectionSize]=useState({w:0,h:0});\n  const [snapGuides,setSnapGuides]=useState<SnapGuides>({});\n",
            'snap state',
          );
          once(
            "      angle:number; started:boolean; members:Piece[]; boxes:Box[]; crop?:{x:number;y:number};\n",
            "      angle:number; started:boolean; members:Piece[]; boxes:Box[]; crop?:{x:number;y:number}; snap?:ReturnType<typeof buildSnapTargets>;\n",
            'drag snap targets',
          );
          once(
            "    const cx=r.left+paper.clientLeft+box.x+box.w/2,cy=r.top+paper.clientTop+box.y+box.h/2;\n    drag.current={id,x:e.clientX,y:e.clientY,mode:cropping&&p.kind==='photo'?'crop':mode,box,canvasW:cw,canvasH:ch,cx,cy,angle:Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI,started:false,members,boxes,crop:{x:p.crop??50,y:p.cropY??50}};\n",
            "    const cx=r.left+paper.clientLeft+box.x+box.w/2,cy=r.top+paper.clientTop+box.y+box.h/2;\n    const movingIds=new Set(members.map(member=>member.id));\n    const snap=mode==='move'&&!(cropping&&p.kind==='photo')?buildSnapTargets(cw,ch,(spread?.elements||[]).filter(q=>!movingIds.has(q.id)&&!isPieceHidden(q)).map(pieceBox)):undefined;\n    setSnapGuides({});\n    drag.current={id,x:e.clientX,y:e.clientY,mode:cropping&&p.kind==='photo'?'crop':mode,box,canvasW:cw,canvasH:ch,cx,cy,angle:Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI,started:false,members,boxes,crop:{x:p.crop??50,y:p.cropY??50},snap};\n",
            'pointer down targets',
          );
          once(
            "    }else{box.x=d.box.x+dx;box.y=d.box.y+dy;}\n    if(d.members.length>1){",
            "    }else{\n      box.x=d.box.x+dx;box.y=d.box.y+dy;\n      if(!e.altKey&&d.snap){const snapped=snapMoveBox(box,d.snap,6);box={...box,...snapped.box};setSnapGuides(snapped.guides);}\n      else setSnapGuides({});\n    }\n    if(d.mode!=='move')setSnapGuides({});\n    if(d.members.length>1){",
            'pointer move snapping',
          );
          once(
            "  function insertLibraryAssets(list:Asset[]) {\n",
            "  function endPointerDrag(){drag.current=null;setSnapGuides({});}\n  function insertLibraryAssets(list:Asset[]) {\n",
            'drag end helper',
          );
          once(
            "                      <div className=\"paper-grain\" />\n                      {decorative.filter(p=>!isPieceHidden(p)).map((p) => (",
            "                      <div className=\"paper-grain\" />\n                      {snapGuides.x!==undefined&&<span aria-hidden=\"true\" data-editor-ui=\"true\" style={{position:'absolute',left:snapGuides.x,top:0,bottom:0,width:1,background:'rgba(59,130,246,.72)',boxShadow:'0 0 0 1px rgba(255,255,255,.55)',zIndex:9999,pointerEvents:'none'}}/>}\n                      {snapGuides.y!==undefined&&<span aria-hidden=\"true\" data-editor-ui=\"true\" style={{position:'absolute',top:snapGuides.y,left:0,right:0,height:1,background:'rgba(59,130,246,.72)',boxShadow:'0 0 0 1px rgba(255,255,255,.55)',zIndex:9999,pointerEvents:'none'}}/>}\n                      {decorative.filter(p=>!isPieceHidden(p)).map((p) => (",
            'guide rendering',
          );
          once(
            "                          onPointerUp={() => {\n                            drag.current = null;\n                          }}\n                          onPointerCancel={() => {\n                            drag.current = null;\n                          }}",
            "                          onPointerUp={endPointerDrag}\n                          onPointerCancel={endPointerDrag}",
            'piece drag end',
          );
          once(
            "                        onPointerUp={()=>{drag.current=null}}\n                        onPointerCancel={()=>{drag.current=null}}",
            "                        onPointerUp={endPointerDrag}\n                        onPointerCancel={endPointerDrag}",
            'selection drag end',
          );
          once(
            "                ? '拖动元素调整位置 · 拖动页角或使用方向键翻页'",
            "                ? '拖动元素调整位置 · 自动吸附并显示参考线 · 按住 Alt 临时关闭吸附'",
            'footer snap hint',
          );
          fs.writeFileSync(file,s);
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(pkg.version!=='0.1.109') throw new Error('Unexpected version '+pkg.version);
          pkg.version='0.1.110';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          fs.rmSync('.github/workflows/stage-snap-guides-v110.yml');
          NODE
      - name: Run focused regression tests
        run: node --experimental-strip-types --test tests/snap-guides.test.mjs tests/layer-panel.test.mjs
      - name: Commit staged product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx package.json lib/snap-guides.ts tests/snap-guides.test.mjs .github/workflows/stage-snap-guides-v110.yml
          git commit -m "stage: snap guides v0.1.110 [skip ci]"
          git push origin HEAD:automation/snap-guides-v110
